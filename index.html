body{font-family:Arial;margin:0;padding:16px;background:#fff;color:#222}
h1{text-align:center;color:#2457c5}
h2{color:#2457c5}
.section{border:1px solid #ddd;border-radius:12px;padding:12px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button{padding:12px 8px;border:0;border-radius:8px;background:#2457c5;color:white;font-size:14px;cursor:pointer;min-width:0}
button:active{background:#173d91}
.secondary{background:#edf2ff;color:#222;border:1px solid #dce4ff}
#details{padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:10px}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.modal{display:none;position:fixed;inset:0;background:#0008;padding:15px;z-index:10}
.modalBox{background:white;padding:18px;margin:35px auto;max-width:500px;max-height:80vh;overflow:auto;border-radius:12px}
.close{background:#555;width:100%;margin-top:12px}

<p style="text-align:center">Your Personal Learning Platform</p>

<div class="section">
<h2>1. All Departments</h2>
<div id="departments" class="grid"></div>
</div>

<div class="section">
<h2>2. All Courses</h2>
<div id="courses" class="grid">
Select a department.
</div>
</div>

<div class="section">
<h2>3. All Subjects</h2>
<div id="subjects" class="grid">
Select a course.
</div>
</div>

<div class="section">
<h2>4. All Topics</h2>
<div id="topics" class="grid">
Select a subject.
</div>
</div>

<div class="section">
<h2>5. Entrance Exams</h2>
<div class="grid">
<button onclick="exam('JEE Main')">JEE Main</button>
<button onclick="exam('JEE Advanced')">JEE Advanced</button>
<button onclick="exam('NEET UG')">NEET UG</button>
</div>
</div>

<div class="section">
<h2>6. Ask IntelliMind AI</h2>
<input id="question" placeholder="Enter your question">
<button style="width:100%;margin-top:8px" onclick="ask()">Ask AI</button>
<div id="answer"></div>
</div>

<div class="modal" id="modal" onclick="closeOutside(event)">
<div class="modalBox">
<h2 id="modalTitle"></h2>
<p id="modalText"></p>
<button class="close" onclick="closeModal()">Close</button>
</div>
</div>

let selectedDepartment="";
let selectedCourse="";
let selectedSubject="";

function makeButton(name,container,fn){
let b=document.createElement("button");
b.textContent=name;
b.onclick=()=>fn(name);
container.appendChild(b);
}

function renderDepartments(){
let box=document.getElementById("departments");
Object.keys(data).forEach(name=>{
makeButton(name,box,selectDepartment);
});
}

function selectDepartment(name){
selectedDepartment=name;
selectedCourse="";
selectedSubject="";
document.getElementById("courses").innerHTML="";
document.getElementById("subjects").innerHTML="Select a course.";
document.getElementById("topics").innerHTML="Select a subject.";
Object.keys(data[name]).forEach(c=>{
makeButton(c,document.getElementById("courses"),selectCourse);
});
document.getElementById("courses").scrollIntoView({behavior:"smooth"});
}

function selectCourse(name){
selectedCourse=name;
selectedSubject="";
document.getElementById("subjects").innerHTML="";
document.getElementById("topics").innerHTML="Select a subject.";
Object.keys(data[selectedDepartment][name]).forEach(s=>{
makeButton(s,document.getElementById("subjects"),selectSubject);
});
document.getElementById("subjects").scrollIntoView({behavior:"smooth"});
}

function selectSubject(name){
selectedSubject=name;
let box=document.getElementById("topics");
box.innerHTML="";
data[selectedDepartment][selectedCourse][name].forEach(t=>{
makeButton(t,box,selectTopic);
});
box.scrollIntoView({behavior:"smooth"});
}

function selectTopic(name){
document.getElementById("question").value=name;
let message="Department: "+selectedDepartment+
"\nCourse: "+selectedCourse+
"\nSubject: "+selectedSubject+
"\nTopic: "+name+
"\n\nThis is a learning topic. You can ask a question about it.";
showModal(name,message);
}

function exam(name){
let info={
"JEE Main":"Engineering entrance examination. Subjects: Physics, Chemistry and Mathematics.",
"JEE Advanced":"IIT undergraduate engineering entrance examination. Subjects: Physics, Chemistry and Mathematics.",
"NEET UG":"Undergraduate medical entrance examination. Subjects: Physics, Chemistry and Biology."
};
showModal(name,info[name]);
}

function showModal(title,message){
document.getElementById("modalTitle").textContent=title;
document.getElementById("modalText").textContent=message;
document.getElementById("modal").style.display="block";
}
function closeModal(){
document.getElementById("modal").style.display="none";
}
function closeOutside(e){
if(e.target.id==="modal")closeModal();
}
function ask(){
let q=document.getElementById("question").value.trim();
let a=document.getElementById("answer");
if(!q){a.textContent="Please enter a question.";return;}
a.textContent="IntelliMind AI learning prototype: You selected "+q+
". Detailed answers need verified learning content or a connected AI service.";
}

renderDepartments();
