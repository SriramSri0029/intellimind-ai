<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntelliMind AI</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:white;color:#222;padding:16px;margin:0}
h1{text-align:center;color:#2457c5}
h2{color:#2457c5}
select,input,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{background:#2457c5;color:white;border:0}
.topic{background:#edf2ff;color:#222;text-align:left}
.panel{padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:12px}
.modal{display:none;position:fixed;inset:0;background:#0008;padding:15px;z-index:5}
.modalBox{background:white;padding:18px;margin:30px auto;max-width:500px;max-height:80vh;overflow:auto;border-radius:12px}
.close{background:#555}
</style>
</head>
<body>

<h1>IntelliMind AI</h1>
<p style="text-align:center">Your Personal Learning Platform</p>

<h2>1. Select Department</h2>
<select id="department" onchange="loadCourses()">
<option value="">Select Department</option>
</select>

<h2>2. Select Course</h2>
<select id="course" onchange="loadSubjects()">
<option value="">Select Course</option>
</select>

<h2>3. Select Subject</h2>
<select id="subject" onchange="loadTopics()">
<option value="">Select Subject</option>
</select>

<h2>4. Select Topic</h2>
<select id="topic" onchange="showTopic()">
<option value="">Select Topic</option>
</select>

<div id="topicInfo" class="panel">
Choose your department, course and subject.
</div>

<h2>5. Entrance Exams</h2>
<button onclick="showExam('JEE Main')">JEE Main</button>
<button onclick="showExam('JEE Advanced')">JEE Advanced</button>
<button onclick="showExam('NEET UG')">NEET UG</button>

<h2>6. Ask IntelliMind AI</h2>
<input id="question" placeholder="Enter your question">
<button onclick="ask()">Ask AI</button>
<div id="answer" class="panel"></div>

<div class="modal" id="modal" onclick="closeOutside(event)">
 <div class="modalBox">
  <h2 id="modalTitle"></h2>
  <p id="modalText"></p>
  <button class="close" onclick="closeModal()">Close</button>
 </div>
</div>

const dept=document.getElementById("department");
const course=document.getElementById("course");
const subject=document.getElementById("subject");
const topic=document.getElementById("topic");

Object.keys(data).forEach(d=>{
let o=document.createElement("option");
o.value=d;o.textContent=d;dept.appendChild(o);
});

function resetSelect(element,label){
element.innerHTML="";
let o=document.createElement("option");
o.value="";o.textContent=label;element.appendChild(o);
}

function loadCourses(){
resetSelect(course,"Select Course");
resetSelect(subject,"Select Subject");
resetSelect(topic,"Select Topic");
document.getElementById("topicInfo").textContent="Select a course.";
Object.keys(data[dept.value]||{}).forEach(c=>{
let o=document.createElement("option");
o.value=c;o.textContent=c;course.appendChild(o);
});
}

function loadSubjects(){
resetSelect(subject,"Select Subject");
resetSelect(topic,"Select Topic");
document.getElementById("topicInfo").textContent="Select a subject.";
Object.keys(data[dept.value]?.[course.value]||{}).forEach(s=>{
let o=document.createElement("option");
o.value=s;o.textContent=s;subject.appendChild(o);
});
}

function loadTopics(){
resetSelect(topic,"Select Topic");
document.getElementById("topicInfo").textContent="Select a topic.";
let list=data[dept.value]?.[course.value]?.[subject.value]||[];
list.forEach(t=>{
let o=document.createElement("option");
o.value=t;o.textContent=t;topic.appendChild(o);
});
}

function showTopic(){
let t=topic.value;
if(!t)return;
let message="Department: "+dept.value+
"\nCourse: "+course.value+
"\nSubject: "+subject.value+
"\nTopic: "+t+
"\n\nThis is a learning topic. Ask a question to explore it.";
document.getElementById("topicInfo").textContent=message;
showModal(t,message);
document.getElementById("question").value=t;
}
