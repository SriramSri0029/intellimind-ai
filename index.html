
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntelliMind AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

.container {
  max-width: 900px;
  margin: auto;
}

header {
  background: white;
  padding: 22px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 2px 10px #ddd;
}

header h1 {
  color: #2563eb;
  margin: 0;
}

header p {
  color: #666;
}

h2 {
  margin-top: 28px;
  color: #222;
}

.subjects {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.subject {
  padding: 17px 8px;
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
  color: #333;
}

.subject:hover,
.subject.active {
  background: #dbeafe;
  border-color: #2563eb;
}

.panel {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-top: 20px;
  box-shadow: 0 2px 8px #ddd;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin: 7px 0;
  font-size: 16px;
}

button {
  cursor: pointer;
}

.primary {
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  margin-top: 8px;
}

.danger {
  background: #dc2626;
  color: white;
  border: none;
  padding: 9px 14px;
  border-radius: 7px;
}

.chatbox {
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 12px;
  min-height: 180px;
  max-height: 350px;
  overflow-y: auto;
}

.message {
  padding: 11px;
  border-radius: 9px;
  margin: 8px 0;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.user {
  background: #dbeafe;
  text-align: right;
}

.bot {
  background: #e5e7eb;
}

.history-item {
  background: #f1f5f9;
  padding: 9px;
  margin: 6px 0;
  border-radius: 7px;
  overflow-wrap: anywhere;
}

.small {
  color: #666;
  font-size: 13px;
}

footer {
  text-align: center;
  margin: 25px 0;
  color: #777;
}

@media (max-width: 600px) {
  body {
    padding: 10px;
  }

  .subjects {
    grid-template-columns: repeat(2, 1fr);
  }

  .subject {
    font-size: 13px;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>🧠 IntelliMind AI</h1>
  <p>Your Smart Learning Assistant</p>
</header>

<h2>📚 Choose Your Subject</h2>

<div class="subjects">
  <button class="subject" onclick="chooseSubject('python',this)">🐍 Python</button>
  <button class="subject" onclick="chooseSubject('maths',this)">📐 Maths</button>
  <button class="subject" onclick="chooseSubject('english',this)">📖 English</button>
  <button class="subject" onclick="chooseSubject('physics',this)">⚡ Physics</button>
  <button class="subject" onclick="chooseSubject('chemistry',this)">🧪 Chemistry</button>
  <button class="subject" onclick="chooseSubject('computer',this)">💻 Computer Science</button>
  <button class="subject" onclick="chooseSubject('biology',this)">🌱 Biology</button>
  <button class="subject" onclick="chooseSubject('social',this)">🌍 Social Science</button>
  <button class="subject" onclick="chooseSubject('statistics',this)">📊 Statistics</button>
  <button class="subject" onclick="chooseSubject('engineering',this)">⚙️ Engineering</button>
  <button class="subject" onclick="chooseSubject('digital',this)">🔌 Digital Electronics</button>
  <button class="subject" onclick="chooseSubject('gk',this)">🌏 General Knowledge</button>
</div>

<div class="panel">
  <h2>🧮 Smart Calculator</h2>
  <input type="number" id="num1" placeholder="Enter first number">
  <input type="number" id="num2" placeholder="Enter second number">

  <button class="primary" onclick="calculate('+')">Addition (+)</button>
  <button class="primary" onclick="calculate('-')">Subtraction (-)</button>
  <button class="primary" onclick="calculate('*')">Multiplication (×)</button>
  <button class="primary" onclick="calculate('/')">Division (÷)</button>

  <p id="result">Result: </p>
</div>

<div class="panel">
  <h2>💬 Ask IntelliMind AI</h2>
  <p id="selected">Please select a subject.</p>

  <div class="chatbox" id="chatbox">
    <div class="message bot">
      Hello! Welcome to IntelliMind AI. Select a subject and ask a question.
    </div>
  </div>

  <input id="question" type="text"
    placeholder="Type your question here..."
    onkeydown="if(event.key==='Enter') ask()">

  <button class="primary" onclick="ask()">Send</button>
</div>

<div class="panel">
  <h2>🕘 Chat History</h2>
  <button class="danger" onclick="clearHistory()">Clear History</button>
  <div id="history"></div>
</div>

<footer>
  IntelliMind AI | Smart Learning Assistant
</footer>

</div>

<script>
let currentSubject = "";

const subjectNames = {
  python: "Python",
  maths: "Maths",
  english: "English",
  physics: "Physics",
  chemistry: "Chemistry",
  computer: "Computer Science",
  biology: "Biology",
  social: "Social Science",
  statistics: "Statistics",
  engineering: "Engineering",
  digital: "Digital Electronics",
  gk: "General Knowledge"
};

function getHistory() {
  try {
    return JSON.parse(localStorage.getItem("intellimindHistory")) || [];
  } catch (error) {
    return [];
  }
}

function saveHistory(type, text) {
  let history = getHistory();
  history.push({type: type, text: text});
  localStorage.setItem("intellimindHistory", JSON.stringify(history));
  loadHistory();
}

function addMessage(type, text) {
  const chatbox = document.getElementById("chatbox");
  const message = document.createElement("div");

  message.className = "message " + type;
  message.textContent = text;
  chatbox.appendChild(message);
  chatbox.scrollTop = chatbox.scrollHeight;

  saveHistory(type, text);
}

function loadHistory() {
  const historyBox = document.getElementById("history");
  historyBox.innerHTML = "";

  let history = getHistory();

  if (history.length === 0) {
    historyBox.textContent = "No chat history yet.";
    return;
  }

  history.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent =
      (item.type === "user" ? "You: " : "AI: ") + item.text;
    historyBox.appendChild(div);
  });
}

function clearHistory() {
  if (confirm("Are you sure you want to clear chat history?")) {
    localStorage.removeItem("intellimindHistory");
    document.getElementById("history").innerHTML =
      "No chat history yet.";
    document.getElementById("chatbox").innerHTML = "";
  }
}

function chooseSubject(subject, button) {
  currentSubject = subject;

  document.querySelectorAll(".subject").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  document.getElementById("selected").textContent =
    "Selected Subject: " + subjectNames[subject];

  addMessage("bot",
    "You selected " + subjectNames[subject] + ". Ask your question!");
}

function calculate(operator) {
  const n1 = document.getElementById("num1").value;
  const n2 = document.getElementById("num2").value;

  if (n1 === "" || n2 === "") {
    document.getElementById("result").textContent =
      "Please enter both numbers.";
    return;
  }

  let a = Number(n1);
  let b = Number(n2);
  let answer;

  if (operator === "+") answer = a + b;
  else if (operator === "-") answer = a - b;
  else if (operator === "*") answer = a * b;
  else if (operator === "/") {
    if (b === 0) {
      document.getElementById("result").textContent =
        "Cannot divide by zero.";
      return;
    }
    answer = a / b;
  }

  document.getElementById("result").textContent =
    "Result: " + answer;
}

function ask() {
  let input = document.getElementById("question");
  let q = input.value.trim().toLowerCase();

  if (q === "") return;

  addMessage("user", input.value);
  input.value = "";

  let a = "";

  if (!currentSubject) {
    a = "Please select a subject first.";
  }

  // PYTHON
  else if (currentSubject === "python") {
    if (q.includes("python"))
      a = "Python is a high-level, interpreted programming language.";
    else if (q.includes("variable"))
      a = "A variable is a name used to store data in Python.";
    else if (q.includes("loop"))
      a = "Loops are used to repeat a block of code. Python has for and while loops.";
    else if (q.includes("list"))
      a = "A list is an ordered and changeable collection of items in Python.";
    else if (q.includes("function"))
      a = "A function is a reusable block of code defined using def.";
    else
      a = "Python is used in AI, web development, automation and data science.";
  }

  // MATHS
  else if (currentSubject === "maths") {
    if (q.includes("add") || q.includes("addition") || q.includes("கூட்டல்"))
      a = "Addition means combining two or more numbers.";
    else if (q.includes("subtract") || q.includes("கழித்தல்"))
      a = "Subtraction means finding the difference between numbers.";
    else if (q.includes("multiply") || q.includes("பெருக்கல்"))
      a = "Multiplication is repeated addition.";
    else if (q.includes("divide") || q.includes("வகுத்தல்"))
      a = "Division means splitting a number into equal parts.";
    else
      a = "Mathematics is the study of numbers, shapes, quantities and patterns.";
  }

  // ENGLISH
  else if (currentSubject === "english") {
    if (q.includes("grammar"))
      a = "Grammar is the set of rules used to speak and write English correctly.";
    else if (q.includes("vocabulary"))
      a = "Vocabulary means the words we know and use.";
    else if (q.includes("good morning"))
      a = "Good morning is a greeting used in the morning.";
    else if (q.includes("thank you"))
      a = "Thank you is used to express gratitude.";
    else if (q.includes("how are you"))
      a = "You can reply: I am fine, thank you.";
    else
      a = "English is a language used for communication around the world.";
  }

  // PHYSICS
  else if (currentSubject === "physics") {
    if (q.includes("force"))
      a = "Force is a push or pull acting on an object.";
    else if (q.includes("energy"))
      a = "Energy is the ability to do work.";
    else if (q.includes("newton"))
      a = "Newton's laws explain the relationship between force and motion.";
    else if (q.includes("motion"))
      a = "Motion is the change in position of an object with time.";
    else if (q.includes("speed"))
      a = "Speed = Distance / Time.";
    else if (q.includes("gravity"))
      a = "Gravity is the force that attracts objects toward each other.";
    else if (q.includes("light"))
      a = "Light is a form of energy that makes vision possible.";
    else
      a = "Physics is the study of matter, energy, force and motion.";
  }

  // CHEMISTRY
  else if (currentSubject === "chemistry") {
    if (q.includes("atom"))
      a = "An atom is the smallest unit of an element that retains its chemical properties.";
    else if (q.includes("molecule"))
      a = "A molecule consists of two or more atoms chemically bonded together.";
    else if (q.includes("water"))
      a = "Water has the chemical formula H2O.";
    else if (q.includes("acid"))
      a = "An acid is a substance that donates hydrogen ions in aqueous solution.";
    else if (q.includes("base"))
      a = "A base can accept hydrogen ions or produce hydroxide ions in water.";
    else if (q.includes("element"))
      a = "An element is a pure substance made of one type of atom.";
    else
      a = "Chemistry is the study of matter, its properties and reactions.";
  }

  // COMPUTER SCIENCE
  else if (currentSubject === "computer") {
    if (q.includes("cpu"))
      a = "CPU stands for Central Processing Unit. It processes instructions.";
    else if (q.includes("input"))
      a = "Input is the data given to a computer.";
    else if (q.includes("output"))
      a = "Output is the result produced by a computer.";
    else if (q.includes("ram"))
      a = "RAM stands for Random Access Memory. It stores data temporarily.";
    else if (q.includes("software"))
      a = "Software is a set of programs that tells a computer what to do.";
    else if (q.includes("hardware"))
      a = "Hardware means the physical parts of a computer.";
    else
      a = "Computer Science is the study of computers and computational systems.";
  }

  // BIOLOGY
  else if (currentSubject === "biology") {
    if (q.includes("cell"))
      a = "The cell is the basic structural and functional unit of life.";
    else if (q.includes("plant"))
      a = "Plants are living organisms that usually make their own food through photosynthesis.";
    else if (q.includes("photosynthesis"))
      a = "Photosynthesis is the process by which green plants use sunlight to make food.";
    else if (q.includes("human"))
      a = "Humans are living organisms belonging to the species Homo sapiens.";
    else
      a = "Biology is the scientific study of living organisms.";
  }

  // SOCIAL SCIENCE
  else if (currentSubject === "social") {
    if (q.includes("democracy"))
      a = "Democracy is a system in which people choose their representatives.";
    else if (q.includes("history"))
      a = "History is the study of past events.";
    else if (q.includes("geography"))
      a = "Geography is the study of Earth, places and environments.";
    else if (q.includes("constitution"))
      a = "A Constitution is the fundamental set of principles and laws of a country.";
    else if (q.includes("india"))
      a = "India is a country in South Asia.";
    else
      a = "Social Science studies society, history, geography, politics and economics.";
  }

  // STATISTICS
  else if (currentSubject === "statistics") {
    if (q.includes("mean"))
      a = "Mean = Sum of values / Number of values.";
    else if (q.includes("median"))
      a = "Median is the middle value when data is arranged in order.";
    else if (q.includes("mode"))
      a = "Mode is the value that occurs most frequently.";
    else if (q.includes("range"))
      a = "Range = Highest value - Lowest value.";
    else
      a = "Statistics is the study of collecting, organizing, analyzing and interpreting data.";
  }

  // ENGINEERING
  else if (currentSubject === "engineering") {
    if (q.includes("ece"))
      a = "Electronics and Communication Engineering studies electronic circuits and communication systems.";
    else if (q.includes("civil"))
      a = "Civil Engineering deals with the design and construction of buildings, roads and bridges.";
    else if (q.includes("mechanical"))
      a = "Mechanical Engineering deals with machines, energy and mechanical systems.";
    else if (q.includes("electrical"))
      a = "Electrical Engineering deals with electricity, electrical machines and power systems.";
    else
      a = "Engineering applies science and mathematics to solve practical problems.";
  }

  // DIGITAL ELECTRONICS
  else if (currentSubject === "digital") {
    // Specific gate checks must come before the general gate check.
    if (q.includes("and gate"))
      a = "AND Gate gives output 1 only when both inputs are 1.";
    else if (q.includes("or gate"))
      a = "OR Gate gives output 1 when at least one input is 1.";
    else if (q.includes("not gate"))
      a = "NOT Gate reverses the input. Input 1 gives output 0, and input 0 gives output 1.";
    else if (q.includes("binary"))
      a = "Binary is a number system that uses only two digits: 0 and 1.";
    else if (q.includes("logic gate") || q.includes("gate"))
      a = "Basic logic gates include AND, OR and NOT gates.";
    else
      a = "Digital Electronics uses digital signals, usually represented by 0 and 1.";
  }

  // GENERAL KNOWLEDGE
  else if (currentSubject === "gk") {
    if (q.includes("capital of india"))
      a = "The capital of India is New Delhi.";
    else if (q.includes("national animal"))
      a = "The national animal of India is the Bengal Tiger.";
    else if (q.includes("national bird"))
      a = "The national bird of India is the Indian Peacock.";
    else if (q.includes("solar system"))
      a = "The Solar System consists of the Sun and the objects that orbit it.";
    else
      a = "General Knowledge includes facts about science, history, geography and current affairs.";
  }

  addMessage("bot", a);
}

loadHistory();
</script>
</body>
</html>
