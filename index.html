
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntelliMind AI</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  color: #222;
  margin: 0;
  padding: 18px;
}
h1 {
  text-align: center;
  color: #2457c5;
}
h2 { color: #2457c5; }
button, select, input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}
button {
  background: #2457c5;
  color: white;
  border: none;
  cursor: pointer;
}
button:hover { background: #173d91; }
#answer, #topicList {
  padding: 14px;
  margin-top: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
}
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  padding: 20px;
  z-index: 10;
}
.modalBox {
  background: white;
  padding: 20px;
  margin: 35px auto;
  max-width: 450px;
  max-height: 75vh;
  overflow-y: auto;
  border-radius: 12px;
}
.topic {
  background: #f2f5ff;
  color: #222;
  text-align: left;
}
.close {
  background: #555;
}
</style>
</head>

<body>

<h1>IntelliMind AI</h1>
<p style="text-align:center">Global Learning Platform</p>

<h2>Entrance Examinations</h2>
<button onclick="showExam('JEE Main')">JEE Main</button>
<button onclick="showExam('JEE Advanced')">JEE Advanced</button>
<button onclick="showExam('NEET UG')">NEET UG</button>

<h2>Select Subject</h2>
<select id="subject" onchange="showTopics()">
<option value="">Select Subject</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Mathematics</option>
<option>Biology</option>
<option>Botany</option>
<option>Zoology</option>
</select>

<div id="topicList">
Select a subject to see its topics.
</div>

<h2>Ask IntelliMind AI</h2>
<input id="question" placeholder="Ask your question">
<button onclick="ask()">Ask AI</button>
<div id="answer"></div>

<div class="modal" id="modal" onclick="closeOutside(event)">
  <div class="modalBox">
    <h2 id="modalTitle"></h2>
    <div id="modalContent"></div>
    <button class="close" onclick="closeModal()">Close</button>
  </div>
</div>

<script>

const topics = {
  "Physics": [
    "Units and Measurements",
    "Motion",
    "Laws of Motion",
    "Work, Energy and Power",
    "Gravitation",
    "Thermodynamics",
    "Waves",
    "Optics",
    "Electricity",
    "Magnetism",
    "Modern Physics"
  ],

  "Chemistry": [
    "Atomic Structure",
    "Periodic Table",
    "Chemical Bonding",
    "States of Matter",
    "Thermodynamics",
    "Chemical Equilibrium",
    "Redox Reactions",
    "Organic Chemistry",
    "Hydrocarbons",
    "Electrochemistry"
  ],

  "Mathematics": [
    "Sets",
    "Relations and Functions",
    "Trigonometry",
    "Complex Numbers",
    "Quadratic Equations",
    "Sequences and Series",
    "Permutations and Combinations",
    "Probability",
    "Limits",
    "Differentiation",
    "Integration",
    "Coordinate Geometry"
  ],

  "Biology": [
    "Living World",
    "Biological Classification",
    "Plant Kingdom",
    "Animal Kingdom",
    "Cell Biology",
    "Biomolecules",
    "Genetics",
    "Evolution",
    "Human Physiology",
    "Ecology"
  ],

  "Botany": [
    "Plant Kingdom",
    "Morphology of Plants",
    "Anatomy of Plants",
    "Plant Physiology",
    "Photosynthesis",
    "Respiration in Plants",
    "Plant Reproduction",
    "Genetics"
  ],

  "Zoology": [
    "Animal Kingdom",
    "Human Anatomy",
    "Human Physiology",
    "Animal Tissues",
    "Evolution",
    "Human Reproduction",
    "Reproductive Health",
    "Animal Diversity"
  ]
};

function showExam(exam) {
  let info = "";

  if (exam === "JEE Main") {
    info = "Engineering entrance examination. Main subjects: Physics, Chemistry and Mathematics.";
  } else if (exam === "JEE Advanced") {
    info = "Entrance examination for IIT undergraduate programmes. Main subjects: Physics, Chemistry and Mathematics.";
  } else {
    info = "Medical entrance examination for undergraduate courses. Main subjects: Physics, Chemistry and Biology.";
  }

  openModal(exam, info);
}

function showTopics() {
  let subject = document.getElementById("subject").value;
  let box = document.getElementById("topicList");

  if (!subject) {
    box.innerText = "Select a subject to see its topics.";
    return;
  }

  box.innerHTML = "<h3>" + subject + " Topics</h3>";

  topics[subject].forEach(function(topic) {
    let btn = document.createElement("button");
    btn.className = "topic";
    btn.innerText = topic;
    btn.onclick = function() {
      openModal(topic, "You selected " + topic + " in " + subject + ". This is a study topic. Select it and ask a question below.");
      document.getElementById("question").value = topic;
    };
    box.appendChild(btn);
  });
}

function openModal(title, content) {
  document.getElementById("modalTitle").innerText = title;
  document.getElementById("modalContent").innerText = content;
  document.getElementById("modal").style.display = "block";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function closeOutside(event) {
  if (event.target.id === "modal") {
    closeModal();
  }
}

function ask() {
  let q = document.getElementById("question").value.toLowerCase();
  let answer = "Please ask a question about your selected subject or topic.";

  if (q.includes("jee")) {
    answer = "JEE is an entrance examination for engineering courses.";
  } else if (q.includes("neet")) {
    answer = "NEET UG is an entrance examination for undergraduate medical courses.";
  } else if (q.includes("physics") || q.includes("motion")) {
    answer = "Physics studies matter, energy, motion and forces.";
  } else if (q.includes("chemistry") || q.includes("atom")) {
    answer = "Chemistry studies matter, elements and chemical reactions.";
  } else if (q.includes("math") || q.includes("algebra")) {
    answer = "Mathematics includes algebra, geometry, calculus and probability.";
  } else if (q.includes("biology") || q.includes("cell")) {
    answer = "Biology is the study of living organisms.";
  } else if (q.includes("botany") || q.includes("plant")) {
    answer = "Botany is the scientific study of plants.";
  } else if (q.includes("zoology") || q.includes("animal")) {
    answer = "Zoology is the scientific study of animals.";
  }

  document.getElementById("answer").innerText = answer;
}

</script>

</body>
</html>
