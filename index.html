<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntelliMind AI</title>

<style>
body {
  font-family: Arial;
  background: white;
  color: #222;
  margin: 0;
  padding: 20px;
}
h1 { text-align: center; color: #2457c5; }
button, select, input {
  padding: 12px;
  margin: 6px 0;
  width: 100%;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: white;
  font-size: 16px;
}
button {
  background: #2457c5;
  color: white;
  cursor: pointer;
}
#answer, #popup {
  margin-top: 15px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
}
#popup { display: none; }
</style>
</head>

<body>

<h1>IntelliMind AI</h1>
<p style="text-align:center">Global Learning Platform</p>

<h3>Entrance Exams</h3>

<button onclick="showExam('JEE Main')">JEE Main</button>
<button onclick="showExam('JEE Advanced')">JEE Advanced</button>
<button onclick="showExam('NEET UG')">NEET UG</button>

<h3>Select Subject</h3>

<select id="subject">
<option value="">Select Subject</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Mathematics</option>
<option>Biology</option>
<option>Botany</option>
<option>Zoology</option>
</select>

<h3>Ask IntelliMind AI</h3>

<input id="question" placeholder="Enter your question">

<button onclick="ask()">Ask AI</button>

<div id="answer"></div>

<div id="popup">
  <h3 id="examTitle"></h3>
  <p id="examInfo"></p>
  <button onclick="closePopup()">Close</button>
</div>

<script>

function showExam(exam) {
  document.getElementById("popup").style.display = "block";
  document.getElementById("examTitle").innerText = exam;

  if (exam === "JEE Main") {
    document.getElementById("examInfo").innerText =
    "JEE Main is an entrance examination for engineering courses. Subjects: Physics, Chemistry and Mathematics.";
  }

  else if (exam === "JEE Advanced") {
    document.getElementById("examInfo").innerText =
    "JEE Advanced is an entrance examination for admission to IIT undergraduate engineering programmes. Subjects: Physics, Chemistry and Mathematics.";
  }

  else {
    document.getElementById("examInfo").innerText =
    "NEET UG is an entrance examination for undergraduate medical courses. Subjects: Physics, Chemistry and Biology.";
  }
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}

function ask() {
  let q = document.getElementById("question").value.toLowerCase();
  let subject = document.getElementById("subject").value;
  let answer = "Please ask a question about " + (subject || "your subject") + ".";

  if (q.includes("jee")) {
    answer = "JEE is an entrance examination for engineering courses.";
  }
  else if (q.includes("neet")) {
    answer = "NEET UG is an entrance examination for undergraduate medical courses.";
  }
  else if (q.includes("physics")) {
    answer = "Physics studies matter, energy, motion and forces.";
  }
  else if (q.includes("chemistry")) {
    answer = "Chemistry studies matter, elements and chemical reactions.";
  }
  else if (q.includes("math")) {
    answer = "Mathematics includes algebra, geometry, calculus and more.";
  }
  else if (q.includes("biology")) {
    answer = "Biology is the study of living organisms.";
  }

  document.getElementById("answer").innerText = answer;
}

</script>

</body>
</html>
