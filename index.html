
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntelliMind AI</title>
<style>
body{font-family:Arial;background:#f4f6fb;padding:12px;color:#222}
header,section{background:white;padding:16px;margin-bottom:14px;border-radius:12px}
h1{color:#1746a2}
button{background:#2455c8;color:white;border:0;padding:12px;border-radius:8px;margin:4px}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.result{background:#eef3ff;padding:12px;border-radius:8px;margin-top:10px;overflow-wrap:anywhere}
</style>
</head>
<body>

<header>
<h1>🌍 IntelliMind AI</h1>
<p>Global Learning Platform</p>
</header>

<section>
<h2>📚 All Categories</h2>
<div class="grid" id="categories"></div>
</section>

<section>
<h2>📖 Select Department & Topic</h2>
<select id="department"></select>
<select id="topic"><option value="">Select Topic</option></select>
<button onclick="study()">Study Selected Topic</button>
<div id="studyResult" class="result">Select a topic.</div>
</section>

<section>
<h2>🌎 World Countries Explorer</h2>
<input id="search" placeholder="Search country..." oninput="filterCountries()">
<select id="country" onchange="showCountry()"></select>
<div id="countryResult" class="result">Select a country.</div>
</section>

<section>
<h2>🤖 Ask IntelliMind</h2>
<div id="chat" class="result">Welcome to IntelliMind AI!</div>
<textarea id="question" placeholder="Ask your question"></textarea>
<button onclick="askAI()">Ask AI</button>
<button onclick="clearChat()">Clear</button>
</section>

<section>
<h2>🧮 Calculator</h2>
<input id="a" type="number" placeholder="First number">
<input id="b" type="number" placeholder="Second number">
<select id="operation">
<option value="add">Addition +</option>
<option value="sub">Subtraction -</option>
<option value="mul">Multiplication ×</option>
<option value="div">Division ÷</option>
</select>
<button onclick="calculate()">Calculate</button>
<div id="answer" class="result">Result will appear here.</div>
</section>

<section>
<h2>🕘 Chat History</h2>
<div id="history" class="result">No history yet.</div>
<button onclick="clearHistory()">Clear History</button>
</section>

<script>

// DEPARTMENTS AND TOPICS

const data = {
"Education":"English Grammar,Spoken English,Mathematics,Physics,Chemistry,Biology,Computer Science,History,Geography,General Knowledge",
"Medical and Healthcare":"MBBS,BDS,Anatomy,Physiology,Biochemistry,Pathology,Microbiology,Pharmacology,Surgery,Nursing,Pharmacy,Physiotherapy,Radiology,Public Health",
"Engineering":"Computer Science Engineering,Electronics and Communication Engineering,Electrical Engineering,Mechanical Engineering,Civil Engineering,Information Technology,Artificial Intelligence,Data Science,Cyber Security,VLSI,Robotics,Automobile Engineering,Aerospace Engineering",
"Arts and Science":"English,Tamil,Mathematics,Physics,Chemistry,Botany,Zoology,Computer Science,Statistics,Psychology,Economics,History,Geography,Sociology",
"Commerce and Management":"Accounting,Finance,Marketing,Business Studies,Banking,Economics,Human Resources,Entrepreneurship,International Business",
"Law":"Constitutional Law,Criminal Law,Civil Law,Contract Law,Corporate Law,International Law,Human Rights,Cyber Law",
"Agriculture":"Agronomy,Horticulture,Soil Science,Plant Pathology,Agricultural Economics,Food Technology",
"Government Exams":"UPSC,TNPSC Group 1,TNPSC Group 2,TNPSC Group 4,SSC,Banking,Railway,Defence,Teaching,GATE,NEET,JEE",
"Private Jobs and Careers":"Software Developer,Web Developer,Data Analyst,AI Engineer,Cyber Security,VLSI Engineer,Doctor,Nurse,Accountant,Teacher,Designer,Digital Marketing",
"World Languages":"English,Tamil,Hindi,French,German,Spanish,Chinese,Japanese,Korean,Arabic,Russian,Grammar,Translation,Speaking Practice",
"Sports Rules":"Cricket,Football,Kabaddi,Volleyball,Basketball,Hockey,Badminton,Tennis,Chess,Athletics,Swimming,Wrestling,Boxing",
"World Laws":"World Legal Systems,Indian Constitution,Fundamental Rights,Human Rights,International Law,Traffic Rules,Cyber Laws",
"World Politics":"World Governments,Democracy,Presidential System,Parliamentary System,Elections,United Nations,International Relations,Indian Politics",
"History and Geography":"World History,Indian History,Ancient History,Modern History,World Geography,Indian Geography,Continents,Oceans,Mountains,Rivers",
"Science and Technology":"Artificial Intelligence,Machine Learning,Robotics,Space Science,Nanotechnology,Biotechnology,Renewable Energy,Quantum Computing",
"General Knowledge":"World GK,Indian GK,Current Affairs,Important Days,Famous Personalities,World Organisations,Discoveries,Inventions,Awards",
"Global Travel":"World Tourism,Beautiful Countries,Tourist Places,Natural Wonders,Travel Planning,Passport,Visa,Air Travel,Train Travel",
"Global Transport and Vehicles":"Airplanes,Helicopters,Private Jets,Passenger Trains,Metro,Bullet Trains,Cars,Electric Vehicles,Buses,Trucks,Motorcycles,Ships,Submarines",
"World Richest People":"World Billionaires,Business Leaders,Entrepreneurs,Technology Founders,Net Worth Rankings",
"World Top Companies":"Technology Companies,Automobile Companies,Healthcare Companies,Banking Companies,Energy Companies,Company Rankings",
"World Countries":"Country Information,Richest Countries,Largest Countries,Smallest Countries,Beautiful Countries,Safest Countries,Capitals,Currencies,Languages,Population,Economy,Culture,Tourism"
};

// LOAD CATEGORIES

const department=document.getElementById("department");
const topic=document.getElementById("topic");

department.innerHTML='<option value="">Select Department</option>';

Object.keys(data).forEach(name=>{
 let op=document.createElement("option");
 op.value=name;
 op.textContent=name;
 department.appendChild(op);

 let btn=document.createElement("button");
 btn.textContent=name;
 btn.onclick=()=>{
   department.value=name;
   loadTopics();
   document.getElementById("department").scrollIntoView();
 };
 document.getElementById("categories").appendChild(btn);
});

// LOAD TOPICS

function loadTopics(){
 topic.innerHTML='<option value="">Select Topic</option>';
 if(!data[department.value]) return;

 data[department.value].split(",").forEach(name=>{
   let op=document.createElement("option");
   op.value=name;
   op.textContent=name;
   topic.appendChild(op);
 });
}

department.addEventListener("change",loadTopics);

function study(){
 let d=department.value;
 let t=topic.value;
 document.getElementById("studyResult").textContent=
 d && t ? "Department: "+d+" | Topic: "+t+". Learning section selected. Detailed lessons can be added next." :
 "Please select a department and topic.";
}

// COUNTRIES

const countries=`Afghanistan,Albania,Algeria,Andorra,Angola,Antigua and Barbuda,Argentina,Armenia,Australia,Austria,Azerbaijan,Bahamas,Bahrain,Bangladesh,Barbados,Belarus,Belgium,Belize,Benin,Bhutan,Bolivia,Bosnia and Herzegovina,Botswana,Brazil,Brunei,Bulgaria,Burkina Faso,Burundi,Cabo Verde,Cambodia,Cameroon,Canada,Central African Republic,Chad,Chile,China,Colombia,Comoros,Congo,Costa Rica,Cote d'Ivoire,Croatia,Cuba,Cyprus,Czechia,Democratic Republic of the Congo,Denmark,Djibouti,Dominica,Dominican Republic,Ecuador,Egypt,El Salvador,Equatorial Guinea,Eritrea,Estonia,Eswatini,Ethiopia,Fiji,Finland,France,Gabon,Gambia,Georgia,Germany,Ghana,Greece,Grenada,Guatemala,Guinea,Guinea-Bissau,Guyana,Haiti,Honduras,Hungary,Iceland,India,Indonesia,Iran,Iraq,Ireland,Israel,Italy,Jamaica,Japan,Jordan,Kazakhstan,Kenya,Kiribati,Kuwait,Kyrgyzstan,Laos,Latvia,Lebanon,Lesotho,Liberia,Libya,Liechtenstein,Lithuania,Luxembourg,Madagascar,Malawi,Malaysia,Maldives,Mali,Malta,Marshall Islands,Mauritania,Mauritius,Mexico,Micronesia,Moldova,Monaco,Mongolia,Montenegro,Morocco,Mozambique,Myanmar,Namibia,Nauru,Nepal,Netherlands,New Zealand,Nicaragua,Niger,Nigeria,North Korea,North Macedonia,Norway,Oman,Pakistan,Palau,Palestine,Panama,Papua New Guinea,Paraguay,Peru,Philippines,Poland,Portugal,Qatar,Romania,Russia,Rwanda,Saint Kitts and Nevis,Saint Lucia,Saint Vincent and the Grenadines,Samoa,San Marino,Sao Tome and Principe,Saudi Arabia,Senegal,Serbia,Seychelles,Sierra Leone,Singapore,Slovakia,Slovenia,Solomon Islands,Somalia,South Africa,South Korea,South Sudan,Spain,Sri Lanka,Sudan,Suriname,Sweden,Switzerland,Syria,Tajikistan,Tanzania,Thailand,Timor-Leste,Togo,Tonga,Trinidad and Tobago,Tunisia,Turkey,Turkmenistan,Tuvalu,Uganda,Ukraine,United Arab Emirates,United Kingdom,United States,Uruguay,Uzbekistan,Vanuatu,Vatican City,Venezuela,Vietnam,Yemen,Zambia,Zimbabwe`.split(",");

const country=document.getElementById("country");

function populate(list){
 country.innerHTML='<option value="">Select Country</option>';
 list.forEach(name=>{
  let op=document.createElement("option");
  op.value=name;
  op.textContent=name;
  country.appendChild(op);
 });
}

function filterCountries(){
 let q=document.getElementById("search").value.toLowerCase();
 populate(countries.filter(c=>c.toLowerCase().includes(q)));
}

function showCountry(){
 document.getElementById("countryResult").textContent=
 country.value ? country.value+" selected. Capital, currency, language, population, geography and culture details can be added using verified country data." : "Select a country.";
}

populate(countries);

// CHATBOT PROTOTYPE

function askAI(){
 let q=document.getElementById("question").value.trim();
 if(!q) return;

 let answer="I can help with Education, Medical, Engineering, Government Exams, Jobs, Languages, Sports, Laws, Politics, Countries, Travel and Science.";

 let s=q.toLowerCase();

 if(s.includes("hello")||s.includes("hi"))
 answer="Hello! Welcome to IntelliMind AI.";

 else if(s.includes("python"))
 answer="Python is a programming language used in software development, automation and data science.";

 else if(s.includes("upsc"))
 answer="UPSC Civil Services Examination includes Preliminary, Main and Interview stages. Check the official UPSC notification.";

 else if(s.includes("english"))
 answer="English grammar includes nouns, pronouns, verbs, tenses and sentence formation.";

 else if(s.includes("ece")||s.includes("engineering"))
 answer="ECE includes electronics, communication systems, embedded systems and VLSI.";

 else if(s.includes("mbbs")||s.includes("medical"))
 answer="Medical subjects include Anatomy, Physiology, Biochemistry, Pathology and Pharmacology.";

 else if(s.includes("kabaddi"))
 answer="Kabaddi is a team sport. Players raid the opposing team's half and score points under the sport's rules.";

 else if(s.includes("math"))
 answer="Mathematics includes arithmetic, algebra, geometry, trigonometry and statistics.";

 document.getElementById("chat").textContent="You: "+q+"\n\nIntelliMind AI: "+answer;

 let h=JSON.parse(localStorage.getItem("imHistory")||"[]");
 h.push("Q: "+q+" | A: "+answer);
 localStorage.setItem("imHistory",JSON.stringify(h));
 showHistory();
 document.getElementById("question").value="";
}

function clearChat(){
 document.getElementById("chat").textContent="Chat cleared.";
}

// CHAT HISTORY

function showHistory(){
 let h=JSON.parse(localStorage.getItem("imHistory")||"[]");
 document.getElementById("history").textContent=
 h.length ? h.slice().reverse().join("\n\n") : "No history yet.";
}

function clearHistory(){
 localStorage.removeItem("imHistory");
 showHistory();
}

// CALCULATOR

function calculate(){
 let a=document.getElementById("a").value;
 let b=document.getElementById("b").value;
 let op=document.getElementById("operation").value;

 if(a===""||b===""){
  document.getElementById("answer").textContent="Enter both numbers.";
  return;
 }

 a=Number(a);
 b=Number(b);

 let r;
 if(op==="add") r=a+b;
 if(op==="sub") r=a-b;
 if(op==="mul") r=a*b;
 if(op==="div") r=b===0?"Cannot divide by zero":a/b;

 document.getElementById("answer").textContent="Result: "+r;
}

// START

showHistory();

</script>
</body>
</html>
