    a = "A list stores multiple values. Example: fruits = ['Apple', 'Mango']";

    a = "A function is a reusable block of code defined using def.";
    } else if (q.includes("add") || q.includes("கூட்டல்")) {
  a = "Addition means adding two numbers. Example: 10 + 5 = 15";
} else if (q.includes("subtract") || q.includes("கழித்தல்")) {
  a = "Subtraction means taking one number away. Example: 10 - 5 = 5";
} else if (q.includes("multiply") || q.includes("பெருக்கல்")) {
