
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntelliMind AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f5ff;color:#222}
header{background:#5145cd;color:white;text-align:center;padding:22px}
main{max-width:850px;margin:auto;padding:12px}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px}
h2{color:#5145cd;font-size:20px}
button{background:#5145cd;color:white;border:0;border-radius:8px;padding:10px;margin:4px;cursor:pointer}
button:hover{background:#30259c}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:7px 0}
#answer,#result{background:#f0efff;padding:12px;border-radius:8px;white-space:pre-wrap}
.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:15px}
.modalbox{background:white;padding:20px;border-radius:12px;width:100%;max-width:450px;max-height:80vh;overflow:auto}
</style>
</head>
<body>

<header>
<h1>🧠 IntelliMind AI</h1>
<p>Your Personal AI Tutor</p>
<p>Learn Anything, Anytime!</p>
</header>

<main>

<section class="card">
<h2>🔎 Search</h2>
<input id="search" placeholder="Search any subject or topic">
<button onclick="searchItems()">Search</button>
<div id="searchResult"></div>
</section>

<section class="card">
<h2>🎓 Departments & Courses</h2>
<div id="departments"></div>
<div id="courses"></div>
<div id="subjects"></div>
<div id="topics"></div>
</section>

<section class="card">
<h2>📝 Entrance Exams</h2>
<div id="entrance"></div>
</section>

<section class="card">
<h2>🏛️ Government Exams</h2>
<div id="government"></div>
</section>

<section class="card">
<h2>💼 Private Jobs</h2>
<div id="jobs"></div>
</section>

<section class="card">
<h2>🌍 World Knowledge</h2>
<div id="world"></div>
<div id="worldItems"></div>
<div id="languageTopics"></div>
</section>

<section class="card">
<h2>💬 Ask IntelliMind AI</h2>
<input id="question" placeholder="Type your question">
<button onclick="ask()">Ask</button>
<div id="answer">Your answer appears here.</div>
</section>

<section class="card">
<h2>📚 Chat History</h2>
<button onclick="showHistory()">View History</button>
<button onclick="clearHistory()">Clear History</button>
<div id="history"></div>
</section>

<section class="card">
<h2>🧮 Calculator</h2>
<input id="calc" placeholder="Example: (10+5)*2">
<button onclick="calculate()">Calculate</button>
<div id="result">Result appears here.</div>
</section>

</main>

<div class="modal" id="modal">
<div class="modalbox">
<h2 id="modalTitle"></h2>
<p id="modalText"></p>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script>

// DEPARTMENTS AND COURSES

const data={

},

},

},

},

},

};

// BUTTON CREATOR

function buttons(items,id,fn){
 const area=document.getElementById(id);
 area.innerHTML="";
 items.forEach(item=>{
  const b=document.createElement("button");
  b.textContent=item;
  b.onclick=()=>fn(item);
  area.appendChild(b);
 });
}

// DEPARTMENT FLOW

let selectedDepartment="",selectedCourse="";

buttons(Object.keys(data),"departments",department);

function department(name){
 selectedDepartment=name;
 selectedCourse="";
 document.getElementById("courses").innerHTML="";
 document.getElementById("subjects").innerHTML="";
 document.getElementById("topics").innerHTML="";
 buttons(Object.keys(data[name]),"courses",course);
}

function course(name){
 selectedCourse=name;
 document.getElementById("subjects").innerHTML="";
 document.getElementById("topics").innerHTML="";
 buttons(data[selectedDepartment][name],"subjects",subject);
}

function subject(name){
 document.getElementById("topics").innerHTML="";
 const topics={
 "Python":["Variables","Data Types","Loops","Functions"],
 "Grammar":["Nouns","Verbs","Tenses","Sentences"],
 "Anatomy":["Bones","Muscles","Organs"],
 "VLSI":["CMOS","Verilog","Digital Design"],
 "Calculus":["Differentiation","Integration"],
 "Digital Electronics":["Logic Gates","Boolean Algebra"]
 };
 const list=topics[name]||["Introduction","Basic Concepts","Examples","Applications"];
 buttons(list,"topics",topic=>popup(topic,"Subject: "+name+"\nCourse: "+selectedCourse+"\nDepartment: "+selectedDepartment+"\n\nAsk IntelliMind AI for a basic explanation."));
}

// EXAMS AND JOBS

const exams=["JEE Main","JEE Advanced","NEET UG","CUET","CLAT","GATE","CAT","NATA","BITSAT"];
const govt=["UPSC","IAS","IPS","TNPSC Group 1","TNPSC Group 2","TNPSC Group 4","SSC","Banking","Railway","NDA","CTET","TET"];
const jobs=["Software Developer","Web Developer","Data Analyst","AI Engineer","ECE Engineer","VLSI Engineer","Mechanical Engineer","Civil Engineer","Nurse","Accountant","Teacher","Designer","Marketing Executive"];

buttons(exams,"entrance",exam=>popup(exam,"Preparation: syllabus, exam pattern, concepts, practice and revision. Check the official exam website for current information."));
buttons(govt,"government",exam=>popup(exam,"Preparation: syllabus, general knowledge, aptitude, reasoning and practice. Check the official notification."));
buttons(jobs,"jobs",job=>popup(job,"Learn the required skills, basic knowledge, communication and interview preparation for this career."));

// WORLD KNOWLEDGE

const world={
"World Countries":["India","United States","United Kingdom","Canada","Australia","China","Japan","France","Germany","Russia","Brazil","South Africa","Nepal","Sri Lanka","Singapore","Malaysia","UAE","Saudi Arabia"],
"Sports Rules":["Cricket","Football","Kabaddi","Hockey","Basketball","Volleyball","Tennis","Badminton","Chess","Athletics","Swimming"],
"Politics & Government":["Democracy","Constitution","Parliament","President","Prime Minister","Chief Minister","Elections","United Nations"],
"Laws & Rights":["Fundamental Rights","Human Rights","Traffic Rules","Consumer Rights","Environmental Law","Child Rights"],
"Travel & Tourism":["Passport","Visa","Air Travel","Train Travel","Tourist Places","World Heritage Sites"],
"Transport":["Airplanes","Trains","Cars","Electric Vehicles","Buses","Ships","Helicopters","Metro","Bullet Trains"],
"World Geography":["Continents","Oceans","Mountains","Rivers","Deserts","Climate","Maps"],
"World Economy":["Richest Countries","GDP","Currency","Developed Countries","International Trade"],
"Business & Companies":["Top Companies","Technology Companies","Automobile Companies","Startups"],
"Famous Entrepreneurs":["Entrepreneurs","Business Leaders","Innovation","Leadership"],
"World History":["Ancient Civilizations","World Wars","Indian History","Modern History"]
};

const languages=["Tamil","English","Hindi","Telugu","Malayalam","Kannada","Urdu","Bengali","Marathi","Gujarati","Punjabi","Arabic","French","German","Spanish","Portuguese","Italian","Russian","Chinese","Japanese","Korean","Thai","Vietnamese","Indonesian","Turkish","Persian","Hebrew","Greek","Dutch","Swahili","Nepali","Sinhala"];

const languageLessons=["Alphabet","Grammar","Vocabulary","Speaking","Reading","Writing","Pronunciation","Translation"];

buttons(["World Countries","World Languages",...Object.keys(world).filter(x=>x!=="World Countries")],"world",showWorld);

function showWorld(name){
 document.getElementById("languageTopics").innerHTML="";
 const items=name==="World Languages"?languages:world[name]||[];
 buttons(items,"worldItems",item=>{
  if(name==="World Languages"){
   popup("Choose a learning topic","Select a topic below:");
   buttons(languageLessons,"languageTopics",lesson=>
    popup(item+" – "+lesson,"Language: "+item+"\nTopic: "+lesson+"\n\nThis is a learning section. Real translation and pronunciation services need suitable language tools."));
  }else{
   popup(item,"Learn basic information about "+item+". For current leaders, laws, rankings and travel rules, check reliable official sources.");
  }
 });
}

// CHATBOT

const replies={
"hello":"Hello! Welcome to IntelliMind AI.",
"hi":"Hi! What would you like to learn?",
"python":"Python is a programming language used in software, automation and data science.",
"variable":"A variable stores data. Example: age = 20.",
"grammar":"Grammar is the set of rules used to speak and write a language.",
"mean":"Mean = Sum of values / Number of values.",
"democracy":"Democracy is a system where people choose their representatives.",
"ece":"ECE means Electronics and Communication Engineering.",
"jee":"JEE Main and JEE Advanced are engineering entrance examinations.",
"neet":"NEET UG is an entrance examination for undergraduate medical courses.",
"mbbs":"MBBS is an undergraduate medical degree.",
"bds":"BDS is an undergraduate dental degree.",
"vlsi":"VLSI means Very Large Scale Integration. It is used in chip design.",
"upsc":"UPSC conducts the Civil Services Examination for various services.",
"ias":"IAS stands for Indian Administrative Service.",
"ips":"IPS stands for Indian Police Service.",
"kabaddi":"Kabaddi is a team sport involving raiding and defending.",
"logic gate":"Logic gates are basic digital circuits such as AND, OR and NOT."
};

function ask(){
 const q=document.getElementById("question").value.trim();
 if(!q){document.getElementById("answer").textContent="Type a question.";return}
 const text=q.toLowerCase();
 let answer="I can help with basic topics. Try Python, Grammar, Maths, ECE, JEE, NEET, MBBS, VLSI or UPSC.";
 for(const key in replies){
  if(text.includes(key)){answer=replies[key];break}
 }
 document.getElementById("answer").textContent=answer;
 let h=JSON.parse(localStorage.getItem("imHistory")||"[]");
 h.unshift({q,a:answer});
 localStorage.setItem("imHistory",JSON.stringify(h.slice(0,30)));
 showHistory();
 document.getElementById("question").value="";
}

// CHAT HISTORY

function showHistory(){
 const h=JSON.parse(localStorage.getItem("imHistory")||"[]");
 const area=document.getElementById("history");
 area.innerHTML="";
 if(!h.length){area.textContent="No history yet.";return}
 h.forEach(x=>{
  const p=document.createElement("p");
  p.textContent="Q: "+x.q+" | A: "+x.a;
  area.appendChild(p);
 });
}
function clearHistory(){
 localStorage.removeItem("imHistory");
 showHistory();
}

// CALCULATOR WITHOUT EVAL

function calculate(){
 const s=document.getElementById("calc").value.replace(/\s/g,"");
 const out=document.getElementById("result");
 if(!s||!/^[0-9+\-*/().]+$/.test(s)){out.textContent="Enter a valid calculation.";return}
 try{
  let i=0;
  function number(){
   if(s[i]==="-"){i++;return -number()}
   if(s[i]==="+"){i++;return number()}
   if(s[i]==="("){
    i++;let v=add();
    if(s[i++]!==")")throw Error();
    return v;
   }
   let start=i;
   while(i<s.length&&/[0-9.]/.test(s[i]))i++;
   if(start===i)throw Error();
   return Number(s.slice(start,i));
  }
  function mul(){
   let v=number();
   while(s[i]==="*"||s[i]==="/"){
    let op=s[i++],n=number();
    if(op==="/"&&n===0)throw Error();
    v=op==="*"?v*n:v/n;
   }
   return v;
  }
  function add(){
   let v=mul();
   while(s[i]==="+"||s[i]==="-"){
    let op=s[i++],n=mul();
    v=op==="+"?v+n:v-n;
   }
   return v;
  }
  let result=add();
  if(i!==s.length||!Number.isFinite(result))throw Error();
  out.textContent="Result: "+result;
 }catch(e){out.textContent="Invalid calculation."}
}

// SEARCH

function searchItems(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const area=document.getElementById("searchResult");
 area.innerHTML="";
 if(!q){area.textContent="Type a search word.";return}
 let found=[];
 Object.keys(data).forEach(d=>{
  if(d.toLowerCase().includes(q))found.push(d);
  Object.keys(data[d]).forEach(c=>{
   if(c.toLowerCase().includes(q))found.push(c);
   data[d][c].forEach(s=>{if(s.toLowerCase().includes(q))found.push(s)});
  });
 });
 [...exams,...govt,...jobs,...languages,...Object.keys(world)].forEach(x=>{
  if(x.toLowerCase().includes(q))found.push(x);
 });
 found=[...new Set(found)];
 if(!found.length){area.textContent="No results found.";return}
 found.slice(0,50).forEach(x=>{
  const b=document.createElement("button");
  b.textContent=x;
  b.onclick=()=>popup(x,"Search result: "+x);
  area.appendChild(b);
 });
}

// MODAL

function popup(title,text){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalText").textContent=text;
 document.getElementById("modal").style.display="flex";
}
function closeModal(){
 document.getElementById("modal").style.display="none";
}
document.getElementById("modal").onclick=e=>{
 if(e.target.id==="modal")closeModal();
};

showHistory();

</script>
</body>
</html>
